version: "3.9"

services:
  db:
    image: postgres:15
    container_name: conf_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: conference_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: conf_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    container_name: conf_redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: conf_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  backend:
    build: ./backend
    container_name: conf_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
      - redis
      - mailhog
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@conf.local
      SMTP_USE_SSL: "false"
      SMTP_USE_STARTTLS: "false"
      FRONTEND_BASE_URL: http://localhost:5173
      MINIO_INTERNAL_HOST: minio:9000
      MINIO_PUBLIC_HOST: host.docker.internal:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: conf_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  minio_data:
