version: "3.9"

services:
  db:
    image: postgres:15
    container_name: conf_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: conf_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    container_name: conf_redis
    restart: always

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: conf_mailhog
    restart: always
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    container_name: conf_backend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
      - minio
      - redis
      - mailhog
    environment:
      ROOT_PATH: /api
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}

      SECRET_KEY: ${SECRET_KEY}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS}

      MINIO_INTERNAL_HOST: ${MINIO_INTERNAL_HOST}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: conf_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    container_name: conf_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  minio_data:
  